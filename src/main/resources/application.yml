spring:
  application:
    name: library-management-solid
  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: root
    password: @minhquyen05112000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Cấu hình mức phạt mặc định (có thể tùy biến)
library:
  fine:
    daily-rate: 5000.00      # 5,000 VND / ngày trễ
    fixed-rate: 50000.00     # 50,000 VND cố định nếu trễ
    default-policy: DAILY    # Chính sách mặc định: DAILY hoặc FIXED
    borrow-period-days: 14   # Thời hạn mượn sách mặc định: 14 ngày

server:
  port: 8080
